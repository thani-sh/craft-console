name: Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests, type check, formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Node runs the app; Bun provides the package manager and the scripts.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test:unit --run

      - name: Type check
        run: bun run check

      - name: Formatting
        run: bun run format:check

      # ESLint is not wired in yet: `bun run lint` has 17 errors on main, tracked in
      # https://github.com/thani-sh/craft-console/issues/4
